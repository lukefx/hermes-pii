name: hermes-pii
version: 0.0.2
python_runtime: external
description: "Offline PII filtering at the execution boundary. Strict detector-error handling requires Hermes MiddlewareAbort support; permissive mode explicitly allows unfiltered text. Not a privacy guarantee."
provides_tools: []
provides_hooks:
  - pre_llm_call
provides_middleware:
  - llm_execution
requires_env: []
config_schema:
  error_policy:
    type: str
    default: strict
    description: "strict aborts on detector errors and requires host MiddlewareAbort support; permissive explicitly sends unfiltered text with a warning"
  language:
    type: str
    default: en
    description: "Language supported by the installed local NLP model"
  model_name:
    type: str
    default: en_core_web_sm
    description: "Pinned en_core_web_sm/it_core_news_sm 3.8.0, or existing absolute model directory; provision with hermes pii install"
  score_threshold:
    type: float
    default: 0.4
    description: "Presidio confidence threshold between 0 and 1"
