name: hermes-pii
version: 0.1.0.dev1
description: "Offline Presidio text filtering and local OCR image redaction. Text passes through on detector errors; uninspectable attachments are omitted. Not a privacy guarantee."
provides_tools: []
provides_hooks:
  - pre_llm_call
provides_middleware:
  - llm_request
requires_env: []
config_schema:
  language:
    type: str
    default: en
    description: "Language supported by the installed local NLP model"
  model_name:
    type: str
    default: en_core_web_sm
    description: "Installed spaCy model or local directory; default model is provisioned at installation"
  score_threshold:
    type: float
    default: 0.4
    description: "Presidio confidence threshold between 0 and 1"
