[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-pii"
version = "0.1.0.dev2"
description = "Local Presidio PII redaction plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "presidio-analyzer>=2.2,<3",
    "spacy>=3.8,<3.9",
    "tldextract>=5,<6",
    "pillow>=10,<13",
    "pytesseract>=0.3.13,<0.4",
]

[project.entry-points."hermes_agent.plugins"]
hermes-pii = "hermes_pii"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_pii*"]

[dependency-groups]
dev = [
    "hermes-agent>=0.19.0",
]
